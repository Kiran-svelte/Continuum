name: web-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: web

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint-test:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: typecheck-lint-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `next build` does not need a reachable database: `prisma generate` only reads
      # schema.prisma (no live connection), and every authenticated page in this app
      # calls cookies()/getAuthEmployee() which auto-opts Next.js out of static
      # generation, so no page tries to query Prisma at build time. Verified locally
      # against this exact env-var set with zero DATABASE_URL connectivity.
      #
      # If a real Neon database is available, set DATABASE_URL/DIRECT_URL as repo
      # secrets (Settings -> Secrets and variables -> Actions) and this step will use
      # them instead of the placeholder values below.
      - name: Build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-placeholder-secret-not-used-in-prod-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-placeholder-secret-not-used-in-prod-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET || 'ci-placeholder-secret-not-used-in-prod-cccccccccccccccccccccccccccccccc' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'ci-placeholder-cron-secret' }}
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
          NODE_ENV: production
        run: npm run build
